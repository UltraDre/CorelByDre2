<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="WebDraw — an offline, single-file vector drawing workspace">
<title>WebDraw</title>
<style>
/* 1. Shell, themes, controls, dockers, dialogs, rulers, print, responsive layout */
:root{
  color-scheme:light;
  --bg:#f5f6f8;--surface:#ffffff;--surface-2:#fbfcfd;--surface-3:#f1f3f6;
  --line:#e4e7ec;--line-soft:#d6dbe3;--text:#202633;--muted:#737d8d;
  --accent:#356fda;--accent-2:#eaf1ff;--danger:#cf5959;--good:#4c9a6b;
  --workspace:#e4e8ed;--field:#ffffff;--hover:#f1f4f8;--focus:#6a9cff;
  --dock-width:282px;--shadow:0 12px 32px #25324a1a;--radius:8px;
  font-family:"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font-size:12px;user-select:none}
body[data-theme="dark"]{color-scheme:dark;--bg:#1e2024;--surface:#282b31;--surface-2:#23262c;--surface-3:#30343b;--line:#3a4049;--line-soft:#4a515d;--text:#e8ebf1;--muted:#9ca6b4;--accent:#75a7ff;--accent-2:#233c64;--workspace:#32363e;--field:#22252a;--hover:#343944;--focus:#9dc3ff;--shadow:0 16px 40px #0006}
body[data-theme="light"]{color-scheme:light;--bg:#f5f6f8;--surface:#ffffff;--surface-2:#fbfcfd;--surface-3:#f1f3f6;--line:#e4e7ec;--line-soft:#d6dbe3;--text:#202633;--muted:#737d8d;--accent:#356fda;--accent-2:#eaf1ff;--workspace:#e4e8ed;--field:#fff;--hover:#f1f4f8;--focus:#6a9cff;--shadow:0 12px 32px #25324a1a}
body[data-theme="contrast"]{color-scheme:dark;--bg:#000;--surface:#080808;--surface-2:#111;--surface-3:#1d1d1d;--line:#fff;--line-soft:#888;--text:#fff;--muted:#ddd;--accent:#00e5ff;--accent-2:#00a6c2;--workspace:#262626;--field:#000;--hover:#282828;--focus:#ff0;--shadow:0 0 0 2px #fff}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line-soft);background:var(--surface-2);border-radius:var(--radius);min-height:25px;padding:3px 8px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button:active{filter:brightness(.9)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input,select,textarea{background:var(--field);border:1px solid var(--line-soft);border-radius:3px;padding:4px 6px;min-height:24px}
input[type="color"]{width:30px;height:24px;padding:2px;cursor:pointer}
input[type="checkbox"]{min-height:auto;accent-color:var(--accent)}
input[type="number"]{width:66px}
select{cursor:pointer}
#app{height:100dvh;min-width:760px;display:grid;grid-template-rows:34px 27px 38px 49px 30px minmax(0,1fr) 32px 32px 24px;background:var(--bg)}
#titlebar{display:flex;align-items:center;gap:9px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line);-webkit-app-region:drag}
.brand-mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(145deg,#35c0ee,#0e6d9a);display:grid;place-items:center;color:white;font-weight:800;font-size:14px;box-shadow:inset 0 1px #ffffff70}
#titleText{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#titlebar button{min-height:23px;padding:1px 8px;-webkit-app-region:no-drag}
.title-actions{display:flex;gap:4px}
#menubar{display:flex;align-items:stretch;padding:0 5px;background:var(--surface);border-bottom:1px solid var(--line);gap:1px;z-index:20}
.menu-wrap{position:relative;display:flex}
.menu-trigger{border:0;background:transparent;border-radius:0;padding:4px 9px;min-height:auto}
.menu-trigger[aria-expanded="true"],.menu-trigger:hover{background:var(--hover)}
.dropdown{position:absolute;top:100%;left:0;min-width:225px;max-height:70vh;overflow:auto;background:var(--surface-2);border:1px solid var(--line-soft);box-shadow:var(--shadow);padding:4px;z-index:80;border-radius:3px}
.dropdown[hidden]{display:none}
.menu-item{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:6px 9px;min-height:27px}
.menu-item:hover,.menu-item:focus{background:var(--accent-2);color:#fff}.menu-item[aria-checked="true"]::before{content:"✓";width:14px;flex:none;color:var(--accent)}.menu-item[aria-checked="false"]::before{content:"";width:14px;flex:none}.menu-item:disabled,.toolcmd:disabled,[data-cmd]:disabled{opacity:.42;cursor:default;filter:none}.menu-item:disabled:hover,.toolcmd:disabled:hover,[data-cmd]:disabled:hover{background:transparent;color:var(--muted)}
.menu-shortcut{color:var(--muted);margin-left:22px;font-size:11px}
.menu-sep{height:1px;background:var(--line-soft);margin:4px 3px}
#standardToolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.toolbar-divider{height:24px;width:1px;background:var(--line-soft);margin:0 3px;flex:none}
.toolcmd{width:29px;min-width:29px;height:28px;min-height:28px;padding:3px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.toolcmd .glyph{display:grid;place-items:center;line-height:0}
.ui-icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toolcmd[aria-pressed="true"],.prop-icon.active{background:var(--accent-2);border-color:var(--accent);color:#fff}
.toolbar-zoom-control{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 5px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--surface-2);flex:none}
.toolbar-zoom-control .ui-icon{width:16px;height:16px;color:var(--muted)}
#zoomSelect{width:96px;height:24px;min-height:24px;padding:1px 3px;font-size:11px;border:0;background:transparent}
#propertyBar{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:4px 8px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;scrollbar-width:thin}
.prop-caption{font-size:10px;color:var(--muted);font-weight:700;margin-right:1px;text-transform:uppercase;letter-spacing:.03em;flex:none}
.prop-field{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:10px;flex:none}
.prop-field input,.prop-field select{color:var(--text);font-size:11px;height:24px;min-height:24px;padding:2px 4px}
.prop-field input[type=number]{width:56px}
.prop-field .wide{width:112px}
.prop-field input[type=color]{width:28px}
.prop-icon{width:27px;height:26px;min-width:27px;min-height:26px;padding:2px;display:inline-grid;place-items:center;flex:none;background:transparent;border-color:transparent}
.prop-icon .ui-icon{width:17px;height:17px}
.prop-quick-actions{display:inline-flex;align-items:center;gap:2px;flex:none}
.prop-section{display:inline-flex;align-items:center;gap:5px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#documentTabs{display:flex;align-items:stretch;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;gap:2px;padding:3px 5px 0}
.doc-tab{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-bottom:0;background:transparent;padding:3px 9px;min-height:26px;max-width:210px;color:var(--muted);cursor:pointer}
.doc-tab.active{background:var(--bg);border-color:var(--line-soft);color:var(--text);border-radius:4px 4px 0 0}
.doc-tab .doc-name{overflow:hidden;text-overflow:ellipsis;max-width:160px}
.doc-tab .close-doc{border:0;padding:0 3px;min-height:18px;background:transparent;color:var(--muted)}
#main{min-height:0;display:grid;grid-template-columns:46px minmax(0,1fr) 5px var(--dock-width);overflow:hidden;position:relative}
#toolbox{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:5px 3px;gap:3px;z-index:2}
.toolbox-section{font-size:9px;color:var(--muted);padding:3px 0 1px;letter-spacing:.06em;text-transform:uppercase}
.tool-button{width:36px;height:34px;min-height:34px;padding:2px;position:relative;background:transparent;border-color:transparent;font-size:17px;display:grid;place-items:center}
.tool-button .tool-name{position:absolute;left:39px;top:4px;display:none;background:var(--surface-2);border:1px solid var(--line-soft);padding:4px 7px;border-radius:3px;z-index:50;box-shadow:var(--shadow);font-size:11px}
.tool-button:hover .tool-name{display:block}
.tool-button.active{background:var(--accent-2);border-color:var(--accent);color:#fff}
.tool-button:focus-visible .tool-name{display:block}
#workspace{min-width:0;min-height:0;display:grid;grid-template-columns:27px minmax(0,1fr);grid-template-rows:23px minmax(0,1fr);background:var(--workspace);position:relative}
.ruler{background:var(--surface);display:block;touch-action:none}
#topRuler{grid-column:2;grid-row:1;width:100%;height:23px;border-bottom:1px solid var(--line);cursor:crosshair}
#leftRuler{grid-column:1;grid-row:2;width:27px;height:100%;border-right:1px solid var(--line);cursor:crosshair}
#cornerRuler{grid-column:1;grid-row:1;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
#canvasWrap{grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:hidden;position:relative;background:var(--workspace)}
#canvas{width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:default}
#canvas:focus-visible{outline:none}
.canvas-text-editor{position:absolute;z-index:4;min-width:24px;min-height:24px;margin:0;padding:0;border:0;border-radius:0;outline:1px solid transparent;outline-offset:1px;background:transparent;color:var(--text);caret-color:var(--accent);resize:none;overflow:hidden;box-sizing:border-box;font-kerning:normal;letter-spacing:normal;line-height:1.22;white-space:pre;user-select:text;-webkit-user-select:text;touch-action:auto}
.canvas-text-editor:focus{outline-color:var(--accent)}
.prop-check{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:10px;white-space:nowrap;flex:none}.prop-check input{width:14px;height:14px;margin:0;min-height:0}
.tool-context-note{font-size:10px;color:var(--muted);padding:0 4px;white-space:nowrap}
.canvas-scrollbar{position:absolute;z-index:3;background:#0002;border-radius:8px;touch-action:none;opacity:.78}.canvas-scrollbar[hidden]{display:none}.canvas-scrollbar[data-scroll-axis="x"]{left:8px;right:18px;bottom:3px;height:10px}.canvas-scrollbar[data-scroll-axis="y"]{top:8px;bottom:18px;right:3px;width:10px}.canvas-scrollbar-thumb{position:absolute;background:var(--accent);border:1px solid #fff8;border-radius:8px;min-width:20px;min-height:20px;cursor:grab}.canvas-scrollbar[data-scroll-axis="x"] .canvas-scrollbar-thumb{top:0;bottom:0}.canvas-scrollbar[data-scroll-axis="y"] .canvas-scrollbar-thumb{left:0;right:0}
#dockSplitter{cursor:col-resize;background:var(--line);z-index:4}
#dockSplitter:hover{background:var(--accent)}
#sideDock{background:var(--surface);border-left:1px solid var(--line);display:grid;grid-template-rows:31px 29px minmax(0,1fr);min-width:0;min-height:0;z-index:5}
#sideDock.floating{position:fixed;right:18px;top:105px;width:var(--dock-width);height:65vh;min-height:260px;max-height:calc(100vh - 125px);resize:both;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line-soft);z-index:60}
#dockHeader{display:flex;align-items:center;gap:8px;padding:3px 6px;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:grab}
#dockHeader:active{cursor:grabbing}
#dockHeader strong{font-size:11px;flex:1}
#dockHeader button{min-height:21px;padding:0 6px}
#dockTabs{display:flex;gap:2px;padding:3px 4px;border-bottom:1px solid var(--line);overflow-x:auto}
.dock-tab{flex:1;min-width:48px;border:0;background:transparent;padding:3px 4px;font-size:10px;color:var(--muted)}
.dock-tab.active{background:var(--surface-3);color:var(--text)}
#dockContent{overflow:auto;padding:7px;min-height:0}
.dock-section{margin:0 0 9px}
.dock-section h3{font-size:11px;margin:2px 0 7px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dock-row{display:flex;align-items:center;gap:5px;padding:3px;border-radius:3px;min-height:25px}
.dock-row:hover{background:var(--hover)}
.dock-row.selected{background:color-mix(in srgb,var(--accent) 23%,transparent);outline:1px solid var(--accent)}
.dock-row .row-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:transparent;padding:3px 4px}
.dock-row .mini{min-height:21px;padding:1px 5px;font-size:10px}
.tree-indent{margin-left:13px;border-left:1px solid var(--line-soft);padding-left:4px}
.tree-icon{width:19px;display:inline-grid;place-items:center;color:var(--muted)}
.dock-form{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:6px;margin-bottom:7px}
.dock-form label{font-size:11px;color:var(--muted)}
.dock-form input,.dock-form select{width:100%;min-width:0}
.history-list{display:flex;flex-direction:column;gap:2px}
.history-item{justify-content:flex-start;text-align:left;font-size:11px;min-height:24px}
.history-item.current{border-color:var(--accent);background:var(--surface-3)}
#paletteBar{display:flex;align-items:center;gap:5px;padding:3px 7px;background:var(--surface);border-top:1px solid var(--line);overflow:hidden}
#paletteLabel{color:var(--muted);font-size:10px;flex:none}
#paletteScroll{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:thin;flex:1;height:100%}
.palette-swatch{width:19px;height:19px;min-width:19px;min-height:19px;padding:0;border:1px solid #1118;border-radius:2px;position:relative}
.palette-swatch:hover{outline:2px solid var(--focus);outline-offset:1px;z-index:1}
.palette-none{background:repeating-linear-gradient(135deg,#fff 0 4px,#d22 4px 6px)}
.palette-menu{margin-left:auto;flex:none}
.status-group{display:flex;align-items:center;gap:7px;overflow:hidden}
#statusBar{display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:var(--surface-2);border-top:1px solid var(--line);color:var(--muted);font-size:10px;gap:8px}
#statusTool{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.status-chip{white-space:nowrap}
.status-swatch{width:13px;height:13px;border:1px solid #111a;border-radius:2px;display:inline-block;vertical-align:middle;margin:0 2px;cursor:pointer}
.status-locked{border:0;background:transparent;min-height:17px;padding:0 3px}
#contextMenu{position:fixed;z-index:100;min-width:190px;background:var(--surface-2);border:1px solid var(--line-soft);box-shadow:var(--shadow);padding:4px;border-radius:4px;max-height:75vh;overflow:auto}
#contextMenu[hidden]{display:none}
#appDialog{padding:0;border:1px solid var(--line-soft);border-radius:6px;background:var(--surface-2);color:var(--text);width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 34px);box-shadow:var(--shadow)}
#appDialog::backdrop{background:#0009;backdrop-filter:blur(2px)}
.dialog-head{display:flex;align-items:center;padding:12px 15px;background:var(--surface);border-bottom:1px solid var(--line-soft);gap:12px}
.dialog-head h2{font-size:15px;margin:0;flex:1}
.dialog-head button{min-height:24px;padding:0 7px}
.dialog-body{padding:14px 16px;overflow:auto;max-height:calc(100vh - 150px);line-height:1.45}
.dialog-actions{display:flex;justify-content:flex-end;gap:7px;padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--surface)}
.dialog-actions .primary{background:var(--accent-2);border-color:var(--accent);color:#fff}
.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.dialog-field{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px}
.dialog-field input,.dialog-field select,.dialog-field textarea{width:100%;color:var(--text)}
.dialog-field.full{grid-column:1/-1}
.dialog-note{padding:8px 10px;background:var(--surface);border-left:3px solid var(--accent);color:var(--muted);margin:7px 0}
.dialog-list{max-height:330px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.dialog-list-item{display:flex;justify-content:space-between;text-align:left}
#toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);z-index:120;background:#17191deF;color:#fff;border:1px solid #ffffff35;padding:8px 13px;border-radius:5px;box-shadow:var(--shadow);max-width:min(650px,90vw);pointer-events:none;opacity:0;transition:opacity .18s}
#toast.show{opacity:1}
#printRoot{display:none}
@media print{
  html,body{overflow:visible!important;background:white!important;color:black!important;height:auto!important}
  #app,#contextMenu,#appDialog,#toast{display:none!important}
  #printRoot{display:block!important}
  .print-page{page-break-after:always;break-after:page;display:block;width:100%;height:auto}
  .print-page:last-child{page-break-after:auto;break-after:auto}
  .print-page svg{width:100%;height:auto;max-height:100vh;object-fit:contain}
  @page{margin:0}
}
@media (max-width:1024px){:root{--dock-width:245px}#standardToolbar .cmd-label{display:none}.tool-button{width:33px}}
@media (max-width:850px){#main{grid-template-columns:42px minmax(0,1fr) 4px 225px}#sideDock{font-size:11px}.doc-tab .doc-name{max-width:115px}}
@media (max-height:700px){#toolbox{gap:0;padding:2px} .tool-button{height:29px;min-height:29px}#app{grid-template-rows:31px 26px 34px 43px 27px minmax(0,1fr) 29px 30px 22px}}
#app.preview-mode{min-width:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#app.preview-mode>#titlebar,#app.preview-mode>#menubar,#app.preview-mode>#standardToolbar,#app.preview-mode>#propertyBar,#app.preview-mode>#documentTabs,#app.preview-mode>#pageBar,#app.preview-mode>#paletteBar,#app.preview-mode>#statusBar{display:none!important}
#app.preview-mode>#main{grid-column:1;grid-row:1;grid-template-columns:minmax(0,1fr)}
#app.preview-mode #toolbox,#app.preview-mode #dockSplitter,#app.preview-mode #sideDock{display:none!important}
#app.preview-mode #workspace{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
#app.preview-mode #cornerRuler,#app.preview-mode #topRuler,#app.preview-mode #leftRuler{display:none!important}
/* Minimal, calm surfaces and compact vector-tool flyouts */
button{border:1px solid transparent;background:transparent;border-radius:8px;min-height:27px;padding:4px 8px;color:var(--text)}
button:hover{background:var(--hover)}
input,select,textarea{border:1px solid var(--line-soft);border-radius:7px;background:var(--field)}
#app{grid-template-rows:34px 27px 37px 45px 30px minmax(0,1fr) 33px 30px 23px}
#titlebar,#menubar,#standardToolbar,#propertyBar,#documentTabs,#paletteBar,#statusBar{background:var(--surface);border-color:var(--line)}
.brand-mark{background:#356fda;border-radius:7px;box-shadow:none}
#titlebar{box-shadow:0 1px 0 #ffffffaa}
#main{grid-template-columns:48px minmax(0,1fr) 5px var(--dock-width)}
#workspace{background:var(--workspace)}
#toolbox{position:relative;align-items:center;gap:2px;padding:7px 4px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.toolbox-section{display:none}
.toolbox-divider{width:24px;height:1px;min-height:1px;background:var(--line);margin:4px 0;flex:none}
.tool-group{position:relative;width:39px;height:37px;min-height:37px;display:grid;place-items:center;flex:none}
.tool-button{width:36px;height:34px;min-height:34px;padding:0;position:relative;background:transparent;border:0;border-radius:9px;color:var(--muted);font-size:12px;display:grid;place-items:center}
.tool-button .ui-icon{width:19px;height:19px}
.tool-button.active{background:var(--accent-2);border:1px solid #cddcff;color:var(--accent);box-shadow:none}
.tool-button:hover{background:var(--hover);color:var(--text)}
.tool-button.active:hover{background:var(--accent-2);color:var(--accent)}
.tool-flyout-trigger{position:absolute;right:0;bottom:0;width:13px;height:13px;min-height:13px;padding:0;border:0;border-radius:4px;background:var(--surface);color:var(--muted);display:grid;place-items:center;opacity:.72}
.tool-flyout-trigger .ui-icon{width:10px;height:10px}
.tool-flyout-trigger:hover,.tool-group.open .tool-flyout-trigger{opacity:1;background:var(--hover);color:var(--accent)}
.tool-flyout{display:none;position:fixed;z-index:110;width:205px;max-height:calc(100vh - 24px);overflow-y:auto;flex-direction:column;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.tool-group.open .tool-flyout{display:flex}
.tool-flyout button{display:flex;align-items:center;gap:9px;width:100%;min-height:32px;padding:5px 8px;border:0;border-radius:7px;text-align:left;color:var(--text)}
.tool-flyout button:hover,.tool-flyout button.active{background:var(--accent-2);color:var(--accent)}
.tool-flyout .ui-icon{width:18px;height:18px;flex:none}
.tool-flyout .tool-label{flex:1;font-size:11px}
.tool-flyout .tool-shortcut{font-size:10px;color:var(--muted)}

function onRgbDockInput(e){const el=e.target;if(!el.matches('#rgbColorInput,#rgbHex,#rgbRed,#rgbGreen,#rgbBlue'))return;let color;if(el.id==='rgbColorInput')color=el.value;else if(el.id==='rgbHex'){const v=el.value.trim();if(!/^#[0-9a-f]{6}$/i.test(v))return;color=v}else{const vals=['rgbRed','rgbGreen','rgbBlue'].map(id=>clamp(parseInt($('#'+id).value)||0,0,255));color='#'+vals.map(v=>v.toString(16).padStart(2,'0')).join('')}const [r,g,b]=hexTriplet(color);$('#rgbColorInput').value=color;$('#rgbHex').value=color;$('#rgbRed').value=r;$('#rgbGreen').value=g;$('#rgbBlue').value=b;$('#rgbHexPreview').textContent=color.toUpperCase();prefs.lastPickedColor=color;savePrefs()}

function register(id,label,run,shortcut=''){ commands[id]={id,label,run,shortcut}}
function runCommand(id){closeMenus();const c=commands[id];if(!c){showMessage('Command unavailable',`The command “${escapeHTML(id)}” is not registered.`);return}if(!commandEnabled(id)){toast('This command is not available in the current context.');return}try{const r=c.run();if(r&&typeof r.catch==='function')r.catch(e=>showMessage('WebDraw',e?.message||'The command could not be completed.'))}catch(e){showMessage('WebDraw',e?.message||'The command could not be completed.')}}
function closeMenus(){for(const x of $$('.dropdown'))x.hidden=true;for(const x of $$('.menu-trigger'))x.setAttribute('aria-expanded','false');contextMenu.hidden=true;closeToolFlyouts()}
function showDialog(title,body,actions=[{label:'Close',value:null}],width){dialog.style.width=width||'';dialog.innerHTML=`<div class="dialog-head"><h2 id="dialogTitle">${escapeHTML(title)}</h2><button type="button" data-dialog-close aria-label="Close dialog">${iconSvg('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-actions">${actions.map((a,i)=>`<button type="button" data-dialog-action="${i}" class="${a.primary?'primary':''}">${escapeHTML(a.label)}</button>`).join('')}</div>`;dialog.showModal();return new Promise(resolve=>{let done=false;const finish=value=>{if(done)return;done=true;if(dialog.open)dialog.close();dialog.removeEventListener('cancel',onCancel);resolve(value)};const onCancel=e=>{e.preventDefault();finish(null)};dialog.addEventListener('cancel',onCancel);$('[data-dialog-close]',dialog).addEventListener('click',()=>finish(null));$$('[data-dialog-action]',dialog).forEach((b,i)=>b.addEventListener('click',()=>{const action=actions[i];if(action.onClick){const value=action.onClick(finish,dialog);if(value===false)return;if(value!==undefined)finish(value)}else finish(action.value)}))})}
function showMessage(title,message){return showDialog(title,`<div>${message}</div>`,[{label:'OK',value:true,primary:true}])}
function askConfirm(title,message,yes='Continue'){return showDialog(title,`<p>${message}</p>`,[{label:'Cancel',value:false},{label:yes,value:true,primary:true}])}
function htmlField(label,id,value='',type='text',extra=''){return`<label class="dialog-field">${escapeHTML(label)}<input id="${id}" type="${type}" value="${escapeHTML(value)}" ${extra}></label>`}
